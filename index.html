<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="a3len Pro - سوق احترافي لبيع وشراء قطع الحاسوب والأجهزة الإلكترونية">
    <meta name="theme-color" content="#00d4ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>a3len Pro | سوق قطع الحاسوب</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2300d4ff' width='100' height='100'/><text x='50' y='70' font-size='60' font-weight='bold' fill='%230a0e27' text-anchor='middle'>A</text></svg>">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Additional Inline Styles for Performance */
        @font-face {
            font-family: 'CustomFont';
            src: url('font.ttf') format('truetype');
            font-display: swap;
        }
        
        body, input, select, button, textarea {
            font-family: 'CustomFont', 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <!-- Header / Top Bar -->
    <header class="topbar">
        <div class="menu-toggle" onclick="toggleSidebar()">☰</div>
        <div class="logo">a3len</div>
        <div class="tagline">سوق قطع الحاسوب الاحترافية</div>
    </header>

    <!-- Progress Bar System -->
    <div class="top-progress-bar" id="topProgressBar">
        <div class="progress-bar-line" id="progressBarLine"></div>
    </div>

    <!-- Circular Progress -->
    <div class="circular-progress" id="circularProgress">
        <svg viewBox="0 0 36 36">
            <defs>
                <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00d4ff" />
                    <stop offset="100%" stop-color="#00ffcc" />
                </linearGradient>
            </defs>
            <circle class="progress-bg" cx="18" cy="18" r="16"></circle>
            <circle class="progress-fill" cx="18" cy="18" r="16" 
                    stroke-dasharray="100" stroke-dashoffset="100"></circle>
        </svg>
    </div>

    <!-- Progress Overlay -->
    <div class="progress-overlay" id="progressOverlay">
        <div class="progress-overlay-content">
            <div class="progress-overlay-spinner"></div>
            <div class="progress-overlay-text" id="progressText">جاري التحميل...</div>
            <div class="progress-overlay-subtext" id="progressSubtext">يرجى الانتظار</div>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" onclick="closeSidebar()"></div>

    <!-- Main Layout -->
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button onclick="showHome()">🏠 الرئيسية</button>
            <button onclick="showPublish()">➕ نشر إعلان</button>
            <div id="authSection" class="auth-section"></div>
        </aside>

        <!-- Main Content -->
        <main id="content"></main>
    </div>

    <!-- Budget Dialog -->
    <div class="budget-dialog" id="budgetDialog">
        <h3>💰 حدد ميزانيتك</h3>
        <input type="number" id="maxBudget" placeholder="مثال: 500000" min="0" max="10000000">
        <div style="text-align:right">
            <button onclick="applyBudget()">✓ تطبيق</button>
            <button class="close-btn" onclick="closeBudget()">✕ إلغاء</button>
        </div>
    </div>

    <!-- Product Details Dialog -->
    <div class="details-dialog" id="detailsDialog">
        <div id="detailsContent"></div>
        <button onclick="closeDetails()">← العودة للرئيسية</button>
    </div>

    <!-- Session Timeout Warning -->
    <div class="session-timeout" id="sessionTimeout">
        <span id="timeoutMessage">ستنتهي جلسة العمل خلال <span id="timeoutTimer">60</span> ثانية</span>
        <button onclick="extendSession()">⏱️ توسيع الوقت</button>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

    <script>
        // ===== Firebase Configuration =====
        const firebaseConfig = {
            apiKey: "AIzaSyAl3XunFOwHpGw-4_VYyETMtoLgk4mnRpQ",
            authDomain: "a3len-3ad54.firebasestorage.app",
            databaseURL: "https://a3len-3ad54-default-rtdb.firebaseio.com",
            projectId: "a3len-3ad54",
            storageBucket: "a3len-3ad54.firebasestorage.app",
            messagingSenderId: "767338034080",
            appId: "1:767338034080:web:801d77fb74c0aa56e92ac5"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.database();
        const analytics = firebase.analytics();

        // ===== Progress Manager Class =====
        class ProgressManager {
            constructor() {
                this.topProgressBar = document.getElementById('topProgressBar');
                this.progressBarLine = document.getElementById('progressBarLine');
                this.circularProgress = document.getElementById('circularProgress');
                this.progressOverlay = document.getElementById('progressOverlay');
                this.progressText = document.getElementById('progressText');
                this.progressSubtext = document.getElementById('progressSubtext');
                
                this.currentProgress = 0;
                this.progressInterval = null;
                this.isLoading = false;
            }
            
            showTopProgressBar() {
                this.topProgressBar.style.display = 'block';
                this.progressBarLine.style.width = '30%';
                
                if (this.progressInterval) clearInterval(this.progressInterval);
                
                this.progressInterval = setInterval(() => {
                    if (this.currentProgress < 90) {
                        this.currentProgress += Math.random() * 30;
                        this.progressBarLine.style.width = this.currentProgress + '%';
                    }
                }, 200);
            }
            
            hideTopProgressBar() {
                if (this.progressInterval) clearInterval(this.progressInterval);
                this.progressBarLine.style.width = '100%';
                
                setTimeout(() => {
                    this.topProgressBar.style.display = 'none';
                    this.progressBarLine.style.width = '0%';
                    this.currentProgress = 0;
                }, 300);
            }
            
            showCircularProgress() {
                this.circularProgress.style.display = 'flex';
            }
            
            hideCircularProgress() {
                this.circularProgress.style.display = 'none';
            }
            
            showOverlay(title = 'جاري المعالجة...', subtitle = '') {
                this.progressText.textContent = title;
                this.progressSubtext.textContent = subtitle;
                this.progressOverlay.classList.add('active');
            }
            
            hideOverlay() {
                this.progressOverlay.classList.remove('active');
            }
            
            showSuccess(message = 'تم بنجاح!') {
                this.progressBarLine.className = 'progress-bar-line';
                this.progressBarLine.style.background = 'linear-gradient(90deg, #00dd88, #00ffcc)';
                this.updateOverlayText(message, '');
                
                setTimeout(() => {
                    this.hideOverlay();
                    this.hideTopProgressBar();
                }, 1500);
            }
            
            showError(message = 'حدث خطأ!') {
                this.progressBarLine.className = 'progress-bar-line progress-error';
                this.updateOverlayText(message, '');
                
                setTimeout(() => {
                    this.hideOverlay();
                    this.hideTopProgressBar();
                }, 1500);
            }
            
            updateOverlayText(title, subtitle) {
                this.progressText.textContent = title;
                this.progressSubtext.textContent = subtitle;
            }
            
            createSkeletonCards(count = 6) {
                let skeletonHTML = '';
                for (let i = 0; i < count; i++) {
                    skeletonHTML += `
                        <div class="skeleton-card">
                            <div class="skeleton-line" style="height: 20px; width: 70%"></div>
                            <div class="skeleton-line" style="height: 16px; width: 40%"></div>
                            <div class="skeleton-line" style="height: 12px; width: 60%"></div>
                            <div class="skeleton-line" style="height: 12px; width: 50%"></div>
                            <div class="skeleton-line" style="height: 12px; width: 80%"></div>
                        </div>
                    `;
                }
                return skeletonHTML;
            }
        }

        // Initialize Progress Manager
        const progressManager = new ProgressManager();

        // ===== Global Variables =====
        let userUID = null;
        let currentUser = null;
        let userDisplayName = null;
        let isAdmin = false;
        let canPublish = true;
        let publishTimer = null;
        let publishTimeLeft = 0;
        let sessionTimeout = null;
        let sessionWarning = null;
        let budget = null;
        let currentPage = 1;
        const postsPerPage = 6;
        const SESSION_DURATION = 60 * 60 * 1000;
        const SESSION_WARNING = 5 * 60 * 1000;

        // ===== Categories & Provinces =====
        const categories = ["CPU", "GPU", "RAM", "Motherboard", "Storage", "Power Supply", "Case", "Cooler", "Accessories"];
        const provinces = ["بغداد", "البصرة", "الموصل", "أربيل", "دهوك", "السليمانية", "نينوى", "الأنبار", "ذي قار", "بابل", "كربلاء", "واسط", "الديوانية", "القادسية", "صلاح الدين", "المثنى", "ميسان", "النجف", "كركوك"];

        // ===== Authentication State =====
        auth.onAuthStateChanged(u => {
            if (u) {
                userUID = u.uid;
                currentUser = u;
                userDisplayName = u.displayName || u.email?.split('@')[0] || 'مستخدم';
                
                if (u.email) {
                    db.ref("users/" + u.uid).update({
                        lastActive: firebase.database.ServerValue.TIMESTAMP
                    });
                }
                
                updateAuthUI();
            } else {
                userUID = null;
                currentUser = null;
                updateAuthUI();
            }
        });

        // ===== Update Auth UI =====
        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            
            if (currentUser && !currentUser.isAnonymous) {
                authSection.innerHTML = `
                    <div class="user-info">
                        <p>👤 ${userDisplayName}</p>
                        <small>مرحباً بك</small>
                        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
                    </div>
                `;
            } else {
                authSection.innerHTML = `
                    <button class="auth-btn" onclick="loginWithGoogle()">🔐 تسجيل الدخول</button>
                    <button class="auth-btn" onclick="loginAnonymously()">👤 دخول سريع</button>
                `;
            }
        }

        // ===== Authentication Functions =====
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(result => {
                    userUID = result.user.uid;
                    userDisplayName = result.user.displayName;
                    progressManager.showSuccess('تم تسجيل الدخول بنجاح');
                    updateAuthUI();
                })
                .catch(error => {
                    progressManager.showError('فشل تسجيل الدخول: ' + error.message);
                });
        }

        function loginAnonymously() {
            auth.signInAnonymously()
                .then(result => {
                    userUID = result.user.uid;
                    userDisplayName = 'مستخدم مجهول';
                    progressManager.showSuccess('تم الدخول بنجاح');
                    updateAuthUI();
                })
                .catch(error => {
                    progressManager.showError('فشل الدخول: ' + error.message);
                });
        }

        function logout() {
            auth.signOut().then(() => {
                userUID = null;
                currentUser = null;
                progressManager.showSuccess('تم تسجيل الخروج');
                showHome();
                updateAuthUI();
            });
        }

        // ===== Sidebar Functions =====
        function toggleSidebar() {
            document.querySelector(".sidebar").classList.toggle("active");
            document.querySelector(".overlay").classList.toggle("active");
        }

        function closeSidebar() {
            document.querySelector(".sidebar").classList.remove("active");
            document.querySelector(".overlay").classList.remove("active");
        }

        // ===== Home Page =====
        function showHome() {
            closeSidebar();
            progressManager.showTopProgressBar();
            
            setTimeout(() => {
                document.getElementById("content").innerHTML = `
                    <div class="search-bar">
                        <input id="search" placeholder="🔍 ابحث عن قطعة..." onkeyup="loadProducts()" maxlength="50">
                        <select id="cat" onchange="loadProducts()">
                            <option value="">كل الأقسام</option>
                            ${categories.map(c => `<option>${c}</option>`).join("")}
                        </select>
                        <button onclick="showBudgetDialog()" class="budget-btn">💰 ميزانيتك</button>
                    </div>
                    <div class="cards" id="products"></div>
                    <div id="pagination" style="text-align:center;margin:20px"></div>
                `;
                loadProducts();
                progressManager.hideTopProgressBar();
            }, 300);
        }

        // ===== Load Products =====
        function loadProducts() {
            progressManager.showTopProgressBar();
            const search = document.getElementById("search")?.value.toLowerCase() || "";
            const category = document.getElementById("cat")?.value || "";
            
            document.getElementById("products").innerHTML = progressManager.createSkeletonCards();
            
            db.ref("products").once("value", snapshot => {
                let products = [];
                snapshot.forEach(child => {
                    const product = child.val();
                    product.key = child.key;
                    
                    const matchesSearch = !search || product.name.toLowerCase().includes(search);
                    const matchesCategory = !category || product.category === category;
                    const matchesBudget = !budget || product.price <= budget;
                    
                    if (matchesSearch && matchesCategory && matchesBudget) {
                        products.push(product);
                    }
                });
                
                products.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                const totalPages = Math.ceil(products.length / postsPerPage);
                const start = (currentPage - 1) * postsPerPage;
                const paginatedProducts = products.slice(start, start + postsPerPage);
                
                let html = '';
                paginatedProducts.forEach(p => {
                    const statusClass = `status-${p.status || 'available'}`;
                    const statusText = {
                        'available': '✓ متاح',
                        'sold': '✕ مباع',
                        'reserved': '⏱️ محجوز'
                    }[p.status] || 'متاح';
                    
                    html += `
                        <div class="card" onclick="showDetails('${p.key}')">
                            <div class="card-header">
                                <div>
                                    <div class="card-title">${escapeHTML(p.name)}</div>
                                    <span class="card-category">${p.category}</span>
                                </div>
                                <div class="card-price">${p.price.toLocaleString('ar-IQ')} د.ع</div>
                            </div>
                            <div class="card-info">
                                <div class="card-info-item">
                                    <span class="card-info-label">البائع:</span>
                                    <span class="card-info-value">${escapeHTML(p.seller)}</span>
                                </div>
                                <div class="card-info-item">
                                    <span class="card-info-label">المحافظة:</span>
                                    <span class="card-info-value">${p.province}</span>
                                </div>
                                <div class="card-info-item">
                                    <span class="card-info-label">التوصيل:</span>
                                    <span class="card-info-value">${p.delivery === 'نعم' ? '✓ متاح' : '✕ غير متاح'}</span>
                                </div>
                            </div>
                            <span class="card-status ${statusClass}">${statusText}</span>
                            <div class="card-actions">
                                <button class="card-action-btn" onclick="event.stopPropagation(); contactSeller('${p.phone}')">📞 اتصل</button>
                                <button class="card-action-btn" onclick="event.stopPropagation(); shareProduct('${p.key}')">📤 شارك</button>
                            </div>
                        </div>
                    `;
                });
                
                document.getElementById("products").innerHTML = html || '<p style="text-align:center; color: #a0b0d0;">لا توجد نتائج</p>';
                
                // Pagination
                let paginationHTML = '';
                for (let i = 1; i <= totalPages; i++) {
                    paginationHTML += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
                }
                document.getElementById("pagination").innerHTML = paginationHTML;
                
                progressManager.hideTopProgressBar();
            });
        }

        function goToPage(page) {
            currentPage = page;
            loadProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== Budget Dialog =====
        function showBudgetDialog() {
            document.getElementById("budgetDialog").style.display = "block";
        }

        function closeBudget() {
            document.getElementById("budgetDialog").style.display = "none";
        }

        function applyBudget() {
            const maxBudget = parseFloat(document.getElementById("maxBudget").value);
            if (maxBudget > 0) {
                budget = maxBudget;
                closeBudget();
                currentPage = 1;
                loadProducts();
            }
        }

        // ===== Product Details =====
        function showDetails(k) {
            progressManager.showCircularProgress();
            
            db.ref("products/" + k).once("value", snap => {
                const p = snap.val();
                if (!p) {
                    progressManager.hideCircularProgress();
                    progressManager.showError("الإعلان غير موجود");
                    return;
                }
                
                const statusClass = `status-${p.status || 'available'}`;
                const statusText = {
                    'available': '✓ متاح',
                    'sold': '✕ مباع',
                    'reserved': '⏱️ محجوز'
                }[p.status] || 'متاح';
                
                const detailsHTML = `
                    <h2>${escapeHTML(p.name)}</h2>
                    <div style="background: rgba(0, 212, 255, 0.1); padding: 1rem; border-radius: 10px; margin: 1rem 0;">
                        <p style="font-size: 1.8rem; color: #00d4ff; margin: 0;"><strong>${p.price.toLocaleString('ar-IQ')} د.ع</strong></p>
                    </div>
                    <p><strong>القسم:</strong> ${p.category}</p>
                    <p><strong>البائع:</strong> ${escapeHTML(p.seller)}</p>
                    <p><strong>الهاتف:</strong> <a href="tel:${p.phone}" style="color: #00d4ff;">${p.phone}</a></p>
                    <p><strong>المحافظة:</strong> ${p.province}</p>
                    <p><strong>التوصيل:</strong> ${p.delivery === 'نعم' ? '✓ متاح' : '✕ غير متاح'}</p>
                    <p><strong>الحالة:</strong> <span class="card-status ${statusClass}">${statusText}</span></p>
                    ${p.uid ? `<p><small style="color: #a0b0d0;">معرّف البائع: ${p.uid}</small></p>` : ''}
                `;
                
                document.getElementById("detailsContent").innerHTML = detailsHTML;
                document.getElementById("detailsDialog").style.display = "block";
                progressManager.hideCircularProgress();
            });
        }

        function closeDetails() {
            document.getElementById("detailsDialog").style.display = "none";
        }

        // ===== Contact & Share =====
        function contactSeller(phone) {
            window.open(`https://wa.me/964${phone.substring(1)}`, '_blank');
        }

        function shareProduct(key) {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'a3len Pro',
                    text: 'شاهد هذا الإعلان على a3len',
                    url: url
                });
            } else {
                alert('رابط الإعلان: ' + url);
            }
        }

        // ===== Publish Product =====
        async function showPublish(p = null, k = null) {
            closeSidebar();
            progressManager.showTopProgressBar();
            
            setTimeout(async () => {
                if (!userUID && !currentUser) {
                    const publishAnyway = confirm("يجب تسجيل الدخول لنشر إعلانات. هل تريد المتابعة؟");
                    if (!publishAnyway) {
                        progressManager.hideTopProgressBar();
                        showHome();
                        return;
                    }
                }
                
                const sellerName = userDisplayName || (p ? p.seller : "");
                const sellerField = userDisplayName ? 
                    `<input id="seller" placeholder="اسم البائع" value="${sellerName}" disabled style="background:#374151; color:#9ca3af; cursor:not-allowed;">` :
                    `<input id="seller" placeholder="اسم البائع" value="${sellerName}" maxlength="30">`;
                
                document.getElementById("content").innerHTML = `
                    <div class="form-box">
                        <h2>${p ? "✏️ تعديل إعلان" : "➕ نشر إعلان جديد"}</h2>
                        
                        <input id="name" placeholder="اسم القطعة" value="${p ? escapeHTML(p.name) : ""}" maxlength="50" required>
                        <input id="price" type="number" placeholder="السعر" value="${p ? p.price : ""}" min="0" max="10000000" required>
                        <select id="category">${categories.map(c => `<option ${p && p.category === c ? "selected" : ""}>${c}</option>`).join("")}</select>
                        ${sellerField}
                        <input id="phone" placeholder="رقم الهاتف" value="${p ? p.phone : ""}" pattern="[0][0-9]{10}" required>
                        <small style="color:#a0b0d0; font-size:12px;">يجب أن يبدأ بـ 0 ويتكون من 11 رقم</small>
                        <select id="province">
                            <option value="">اختر المحافظة</option>
                            ${provinces.map(pr => `<option ${p && p.province === pr ? "selected" : ""}>${pr}</option>`).join("")}
                        </select>
                        <select id="delivery">
                            <option value="نعم" ${p && p.delivery === "نعم" ? "selected" : ""}>نعم - التوصيل متاح</option>
                            <option value="لا" ${p && p.delivery === "لا" ? "selected" : ""}>لا - بدون توصيل</option>
                        </select>
                        <button onclick="save('${k || ""}')" id="saveBtn">💾 ${p ? "تحديث" : "نشر"}</button>
                        ${p ? `<button onclick="showHome()" style="background:rgba(107, 114, 128, 0.5); margin-top:10px;">إلغاء</button>` : ''}
                    </div>
                `;
                
                progressManager.hideTopProgressBar();
            }, 300);
        }

        async function save(k) {
            const name = document.getElementById("name").value.trim();
            const price = parseFloat(document.getElementById("price").value.trim());
            const phone = document.getElementById("phone").value.trim();
            const province = document.getElementById("province").value;
            
            if (!name || !price || !phone || !province) {
                progressManager.showError("جميع الحقول مطلوبة");
                return;
            }
            
            if (!/^[0][0-9]{10}$/.test(phone)) {
                progressManager.showError("رقم الهاتف يجب أن يكون 11 رقم ويبدأ بصفر");
                return;
            }
            
            const seller = userDisplayName || document.getElementById("seller").value.trim();
            
            const data = {
                name: name,
                price: price,
                category: document.getElementById("category").value,
                seller: seller,
                phone: phone,
                province: province,
                delivery: document.getElementById("delivery").value,
                status: "available",
                uid: userUID,
                lastUpdated: firebase.database.ServerValue.TIMESTAMP
            };
            
            if (!k) {
                data.createdAt = firebase.database.ServerValue.TIMESTAMP;
                data.timestamp = firebase.database.ServerValue.TIMESTAMP;
            }
            
            progressManager.showOverlay(k ? "جاري تحديث الإعلان..." : "جاري نشر الإعلان...", "قد يستغرق بضع ثوان");
            
            const ref = k ? db.ref("products/" + k) : db.ref("products").push();
            
            ref.set(data).then(() => {
                progressManager.showSuccess(k ? "تم تحديث الإعلان بنجاح" : "تم نشر الإعلان بنجاح");
                setTimeout(() => showHome(), 1000);
            }).catch(error => {
                console.error("Error saving product:", error);
                progressManager.showError("حدث خطأ أثناء حفظ الإعلان");
            });
        }

        // ===== Session Management =====
        function initSessionManagement() {
            ['click', 'mousemove', 'keypress', 'scroll'].forEach(event => {
                document.addEventListener(event, resetSessionTimer);
            });
            resetSessionTimer();
        }

        function resetSessionTimer() {
            if (sessionTimeout) clearTimeout(sessionTimeout);
            if (sessionWarning) clearTimeout(sessionWarning);
            
            document.getElementById('sessionTimeout').style.display = 'none';
            
            sessionWarning = setTimeout(() => showSessionWarning(), SESSION_DURATION - SESSION_WARNING);
            sessionTimeout = setTimeout(() => handleSessionTimeout(), SESSION_DURATION);
        }

        function showSessionWarning() {
            const timeoutDiv = document.getElementById('sessionTimeout');
            const timerSpan = document.getElementById('timeoutTimer');
            
            let secondsLeft = SESSION_WARNING / 1000;
            timerSpan.textContent = secondsLeft;
            timeoutDiv.style.display = 'block';
            
            const countdown = setInterval(() => {
                secondsLeft--;
                timerSpan.textContent = secondsLeft;
                if (secondsLeft <= 0) clearInterval(countdown);
            }, 1000);
        }

        function extendSession() {
            resetSessionTimer();
            progressManager.showSuccess("تم توسيع وقت الجلسة");
        }

        function handleSessionTimeout() {
            if (currentUser && !currentUser.isAnonymous) {
                auth.signOut().then(() => {
                    progressManager.showError("انتهت جلسة العمل");
                    showHome();
                    updateAuthUI();
                });
            }
        }

        // ===== Utility Functions =====
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Initialize =====
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            initSessionManagement();
            showHome();
        });
    </script>
</body>
</html>
